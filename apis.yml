aid: pattern-bioscience
name: Pattern Bioscience
description: 'Pattern Bioscience is a privately held in vitro diagnostics company founded
  in 2016 and headquartered in Austin, Texas, developing a culture-free Single-Cell Microbiology
  system for rapid bacterial identification and antibiotic susceptibility testing (ID/AST).
  The platform isolates individual bacterial cells in picoliter-scale droplets and reads the
  metabolic patterns those cells produce over time, using machine learning to identify the
  pathogen and determine phenotypic susceptibility in hours instead of the days a culture
  workflow requires. The company holds FDA Breakthrough Device Designation for its Pneumonia
  Action Panel, raised $43M in Series D financing in November 2025 to pursue FDA clearance,
  and is backed by Illumina Ventures, Omnimed Capital, CARB-X, the AMR Action Fund and a
  $22.5M BARDA contract. Pattern is pre-commercial: it publishes a marketing and news site at
  pattern.bio and no public API, developer portal, SDK or machine-readable specification.'
